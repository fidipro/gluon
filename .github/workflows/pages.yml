# The docs site (site/, Starlight) on GitHub Pages: https://<owner>.github.io/<repo>/ (site/base.mjs derives both from src/repo.ts).
# Builds on a push to main that touches the site or the docs it shows; `deploy` is the only job that can write to Pages.
# Needs Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-docs-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  # Writes to Pages only: no checkout, no code of the repository runs here.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
