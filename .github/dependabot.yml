# One weekly PR per ecosystem for minor and patch bumps; a major bump comes as its own PR.
# ink is never bumped a major by Dependabot: it draws the whole UI, and only the local visual
# tests (test:visual) cover a redraw change, so a major ink upgrade is done by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: ink
        update-types: ["version-update:semver-major"]
